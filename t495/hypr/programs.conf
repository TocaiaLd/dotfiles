###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = zsh -c "kitty yazi"
$menu = rofi -show drun -show-icons
$browser = firefox
$music = zsh -c "kitty rmpc"
$code = code
$wifi = zsh -c "kitty wifitui --theme=/home/Wesley/.config/wifitui/theme.toml"
$blu = zsh -c "kitty bluetui"
$print = hyprshot -m output --clipboard-only
$print_s = hyprshot -m region --clipboard-only
$sound = pavucontrol
$clipboard = kitty --class clipse -e 'clipse'

windowrule = match:class clipse, float true
windowrule = match:class clipse, size 400 500

$hypr = zsh -c "kitty nano ~/.config/hypr/hyprland.conf"
$powerMenu = ~/.config/waybar/power-menu.sh
